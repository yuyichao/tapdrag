name: Build

on:
  push:
    # Tags are built by release.yml.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to build (e.g. 1.2.3); empty keeps the CMakeLists default
        type: string
        default: ''

jobs:
  dmg:
    # Apple silicon runner; the app is built for arm64 only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Tool versions
        run: |
          cmake --version | head -1
          ninja --version
          swiftc --version

      - name: Configure
        env:
          VERSION: ${{ inputs.version }}
        run: cmake -G Ninja -B build ${VERSION:+-DTAPDRAG_VERSION=$VERSION}

      - name: Build app
        run: cmake --build build

      - name: Build disk image
        # hdiutil on hosted runners occasionally fails with "Resource busy"; retry.
        run: |
          for attempt in 1 2 3; do
            cmake --build build --target dmg && exit 0
            echo "hdiutil failed (attempt $attempt), retrying"
            sleep 5
          done
          exit 1

      - name: Check bundle signature
        run: codesign --verify --deep --strict --verbose=2 build/tapdrag.app

      - uses: actions/upload-artifact@v4
        with:
          name: tapdrag-dmg
          path: build/tapdrag-*.dmg
          if-no-files-found: error
