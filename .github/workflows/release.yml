name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        # v1.2.3 -> 1.2.3. CMake's project(VERSION) only accepts numeric versions.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<major>[.<minor>[.<patch>[.<tweak>]]]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      # Releases must carry the stable signature, or upgrading would reset
      # the Accessibility permission.
      require-signing: true
    secrets: inherit

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tapdrag-dmg
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/tapdrag-*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "tapdrag $VERSION" \
            --generate-notes
